name: Altitude
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Xcode の Signing & Capabilities で自分のチームを選択するか、ここに Team ID を入れてください
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  Altitude:
    type: application
    platform: iOS
    sources:
      - Altitude
      - Shared
    dependencies:
      - target: AltitudeWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.altitude
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: Altitude/Info.plist
      properties:
        CFBundleDisplayName: 標高
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - location
        NSSupportsLiveActivities: true
        NSLocationWhenInUseUsageDescription: 現在地の標高を表示するために位置情報を使用します。
        NSLocationAlwaysAndWhenInUseUsageDescription: バックグラウンドでもロック画面の標高を更新するために位置情報を使用します。
        NSMotionUsageDescription: 気圧センサーで標高をより正確に測定するために使用します。

  AltitudeWidget:
    type: app-extension
    platform: iOS
    sources:
      - AltitudeWidget
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.altitude.widget
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: AltitudeWidget/Info.plist
      properties:
        CFBundleDisplayName: 標高
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
